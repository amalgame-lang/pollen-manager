<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110" width="140" height="110">
  <title>Pollen — Amalgame's P2P bus + workflow orchestrator</title>
  <!-- Grains de pollen dispersés, transportés sans coordinateur central.
       Quelques fils ténus suggèrent le maillage pair-à-pair. -->

  <!-- Maillage P2P (subtil) -->
  <g stroke="#1A1A2E" stroke-width="0.35" opacity="0.22" fill="none">
    <line x1="28"  y1="30" x2="108" y2="28"/>
    <line x1="28"  y1="30" x2="70"  y2="55"/>
    <line x1="108" y1="28" x2="70"  y2="55"/>
    <line x1="70"  y1="55" x2="32"  y2="82"/>
    <line x1="70"  y1="55" x2="105" y2="80"/>
    <line x1="32"  y1="82" x2="105" y2="80"/>
    <line x1="28"  y1="30" x2="15"  y2="55"/>
    <line x1="105" y1="80" x2="125" y2="55"/>
  </g>

  <!-- Grains — ancres -->
  <g>
    <circle cx="28"  cy="30" r="8.5" fill="#F59E0B"/>
    <circle cx="108" cy="28" r="7.5" fill="#8B5CF6"/>
    <circle cx="70"  cy="55" r="6.5" fill="#06B6D4"/>
    <circle cx="32"  cy="82" r="7"   fill="#10B981"/>
    <circle cx="105" cy="80" r="7.5" fill="#F43F5E"/>

    <!-- Grains moyens -->
    <circle cx="55"  cy="18" r="4.5" fill="#8B5CF6" opacity="0.75"/>
    <circle cx="88"  cy="48" r="4.5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="50"  cy="65" r="4.5" fill="#F43F5E" opacity="0.7"/>
    <circle cx="80"  cy="95" r="4"   fill="#F59E0B" opacity="0.85"/>
    <circle cx="15"  cy="55" r="4.5" fill="#06B6D4" opacity="0.7"/>
    <circle cx="125" cy="55" r="4"   fill="#10B981" opacity="0.85"/>
    <circle cx="75"  cy="32" r="3.5" fill="#F43F5E" opacity="0.65"/>
    <circle cx="20"  cy="95" r="3.5" fill="#8B5CF6" opacity="0.55"/>

    <!-- Grains fins (poussières en suspension) -->
    <circle cx="10"  cy="20"  r="2.5" fill="#10B981" opacity="0.7"/>
    <circle cx="45"  cy="45"  r="2.5" fill="#06B6D4" opacity="0.6"/>
    <circle cx="95"  cy="65"  r="2.5" fill="#8B5CF6" opacity="0.65"/>
    <circle cx="125" cy="95"  r="2.5" fill="#F59E0B" opacity="0.55"/>
    <circle cx="135" cy="20"  r="2"   fill="#F43F5E" opacity="0.7"/>
    <circle cx="65"  cy="80"  r="2"   fill="#10B981" opacity="0.55"/>
    <circle cx="115" cy="12"  r="2"   fill="#10B981" opacity="0.6"/>
    <circle cx="5"   cy="75"  r="2"   fill="#F59E0B" opacity="0.65"/>
    <circle cx="95"  cy="10"  r="2"   fill="#F43F5E" opacity="0.55"/>
    <circle cx="62"  cy="7"   r="1.8" fill="#10B981" opacity="0.7"/>
    <circle cx="130" cy="70"  r="1.8" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="40"  cy="102" r="1.8" fill="#06B6D4" opacity="0.7"/>
  </g>
</svg>
